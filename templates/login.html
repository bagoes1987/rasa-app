{% extends "base.html" %}

{% block title %}Login - RASA{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-4 sm:py-8 lg:py-12">
    <div class="max-w-md w-full mx-4">
        <div class="bg-white/70 backdrop-blur-md rounded-3xl shadow-2xl p-4 sm:p-6 lg:p-8">
            <!-- Header -->
            <div class="text-center mb-6 sm:mb-8">
                <div class="text-4xl sm:text-5xl mb-3 sm:mb-4">👋</div>
                <h2 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent mb-2">
                    Welcome Back!
                </h2>
                <p class="text-sm sm:text-base text-gray-600">Senang bertemu lagi! Login yuk~ 💜</p>
            </div>
            
            <!-- Form -->
            <form method="POST" action="{{ url_for('login') }}" class="space-y-4 sm:space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-envelope mr-2 text-purple-600"></i>Email (Username)
                    </label>
                    <input type="email" id="email" name="email" required
                           class="w-full px-3 sm:px-4 py-2 sm:py-3 rounded-lg border border-gray-300 focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition text-sm sm:text-base"
                           placeholder="contoh@email.com" autofocus>
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-lock mr-2 text-purple-600"></i>Password
                    </label>
                    <div class="relative">
                    <input type="password" id="password" name="password" required
                           class="w-full px-3 sm:px-4 py-2 sm:py-3 pr-10 sm:pr-12 rounded-lg border border-gray-300 focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition text-sm sm:text-base"
                           placeholder="Masukkan password">
                        <button type="button" onclick="togglePassword('password')" 
                                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                            <i class="fas fa-eye" id="password-eye"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" 
                        class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white font-bold py-2 sm:py-3 rounded-lg hover:shadow-xl transform hover:scale-105 transition-all text-sm sm:text-base">
                    <i class="fas fa-sign-in-alt mr-2"></i>Login
                </button>
            </form>
            
            <!-- Footer -->
            <div class="mt-4 sm:mt-6 text-center">
                <p class="text-sm sm:text-base text-gray-600">
                    Belum punya akun? 
                    <a href="{{ url_for('register') }}" class="text-purple-600 font-semibold hover:text-purple-700">
                        Daftar sekarang
                    </a>
                </p>
            </div>
        </div>
        
        <div class="text-center mt-4 sm:mt-6">
            <a href="{{ url_for('index') }}" class="text-sm sm:text-base text-gray-600 hover:text-purple-600 transition">
                <i class="fas fa-arrow-left mr-2"></i>Kembali ke beranda
            </a>
        </div>
    </div>
</div>

<script>
function togglePassword(fieldId) {
    const field = document.getElementById(fieldId);
    const eyeIcon = document.getElementById(fieldId + '-eye');
    
    if (field.type === 'password') {
        field.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
    } else {
        field.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
